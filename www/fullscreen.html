<!DOCTYPE html>
<html>

<head>
  <meta name="color-scheme" content="dark light">
  <meta charset="utf-8">
  <title>fork-observer</title>
  <meta name="author" content="">
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="static/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor">
  <link href="static/css/style.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="static/img/logo.svg">
</head>

<body>
  <div style="display: flex; flex-direction: column; position: relative; height: 100vh;">
    <svg style="flex: 1 1 auto;" id="drawing-area"></svg>
    <div id="countdown-display" class="countdown-display" style="display: none"></div>
  </div>
  <div class="toolbar-controls" style="position: absolute; bottom: 0px; z-index: 1; background-color: rgb(from var(--surface-bg) r g b / 80%)">
    <label class="d-flex align-items-center gap-2 m-0" title="Play a short sound when the chain tip changes">
      <span class="small text-muted-soft">sound on block</span>
      <input type="checkbox" name="sound" id="sound" class="form-check-input m-0">
    </label>
    <label class="d-flex align-items-center gap-2 m-0">
      <span class="small text-muted-soft">orientation</span>
      <select name="orientation" id="orientation" class="form-select form-select-sm"></select>
    </label>
    <button class="btn btn-sm btn-outline-secondary" onclick="recenter()">re-center</button>
  </div>
</body>

<script src="static/js/d3.v7.min.js"></script>
<script src="static/js/blocktree.js"></script>
<script src="static/js/main.js"></script>
</html>
